<body>

<div class="sidenavbar">

            <li class="sidenavbarlinklogo"><a href="index.html">LsbPrint</a></li>

  <input class="searchbar" id="search-side" placeholder="Search" type="text" oninput="handleSearch('side')">
<div id="search-overlay-side">

</div>



    <div class="addstripe2">
        <div class="customordertxt"><p>Ingenting her passer?   Legg in custom bestilling for å få det du trenger!</p><p>Send en melding til: mail@mail.com</p></div>

    </div>



<input id="product-search" placeholder="Søk etter produkt..." type="text" oninput="searchProducts()">

<div id="product-list"></div>



<script>




// Display logged in users email in the navbar
    async function userloggedin(){
        const res = await fetch('/getemail');
        const data = await res.json();

        if (data.email) {
            document.getElementById('loggedinuserID').textContent = data.email;
        } else {
            document.getElementById('loggedinuserID').textContent = data.email;
            
        }

    }
userloggedin();

// Show signout button and hide login button if user is logged in
    async function checkSession(){
        const res = await fetch('/check-session');
        const data = await res.json();

        if (data.loggedIn) {
            document.getElementById('signout-btn'). style.display = 'block';
            document.getElementById('logginbtnID'). style.display = 'none';
        }
    }

    checkSession();

// Sign out and redirect to login page
    async function signOut(){
        await fetch('/signout', { method: 'POST' });
        window.location.href = '/login.html';
    }



// Build and inject product cards into the product-list div
    function displayProducts(products) {
        const container = document.getElementById('product-list');
        container.innerHTML = '';

        products.forEach(product => {
            container.innerHTML += `
                <div class="card">
    <div class="card-img"> <img class="prodimg" src="/images/${product.image}" alt="${product.name}" >  </div>
    <div class="card-title">${product.name}</div>
    <div class="card-subtitle">${product.description}</div>
    <hr class="card-divider">
    <div class="card-footer">
        <div class="card-price"><span>kr</span>${product.price}</div>
        <button class="card-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="m397.78 316h-205.13a15 15 0 0 1 -14.65-11.67l-34.54-150.48a15 15 0 0 1 14.62-18.36h274.27a15 15 0 0 1 14.65 18.36l-34.6 150.48a15 15 0 0 1 -14.62 11.67zm-193.19-30h181.25l27.67-120.48h-236.6z"></path><path d="m222 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z"></path><path d="m368.42 450a57.48 57.48 0 1 1 57.48-57.48 57.54 57.54 0 0 1 -57.48 57.48zm0-84.95a27.48 27.48 0 1 0 27.48 27.47 27.5 27.5 0 0 0 -27.48-27.47z"></path><path d="m158.08 165.49a15 15 0 0 1 -14.23-10.26l-25.71-77.23h-47.44a15 15 0 1 1 0-30h58.3a15 15 0 0 1 14.23 10.26l29.13 87.49a15 15 0 0 1 -14.23 19.74z"></path></svg>
        </button>
    </div>
<button onclick="favoriteToggle(${product.id})" class="favorite-btn">
    <span class="material-symbols-outlined">favorite</span>
</button>
</div>
                `;
        });
    };

async function favoriteToggle(productId) {

  try {
    const res = await fetch('/favorites/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json'}, 
      body: JSON.stringify({productId: productId})
    });
    if (res.status === 401) {
      alert('Vennligst log inn for å lagre favoritter');
      return;
    }


    alert('Lagt til favoritter!');
    return;
  }
  catch (err) {
    console.error('Error: ', err);

  }
}





    let allProducts = [];

// Filter displayed products based on search input
    async function loadProducts() {
        const res      = await fetch('/products');
        allProducts    = await res.json();
        displayProducts(allProducts);
        };

function searchProducts() {
    const query    = document.getElementById('product-search').value.toLowerCase();
    const filtered = allProducts.filter(product =>
        product.name.toLowerCase().includes(query) ||
        product.description.toLowerCase().includes(query)
    );
    displayProducts(filtered);
}


    loadProducts();




// Fetch products once and cache them to avoid repeated server calls
async function fetchProducts() {
  if (allProducts.length === 0) {
    const res  = await fetch('/products');
    allProducts = await res.json();
  }
}
// Handle search input — show overlay with matching products
async function handleSearch() {
  const query   = document.getElementById('search').value.toLowerCase();
  const overlay = document.getElementById('search-overlay');
  const results = document.getElementById('search-results');

  if (query.trim() === '') {
    overlay.classList.remove('active');
    return;
  }

  await fetchProducts();

  const filtered = allProducts.filter(product =>
    product.name.toLowerCase().includes(query) ||
    product.description.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    results.innerHTML = '<p style="padding:10px">No results found.</p>';
  } else {
    results.innerHTML = filtered.map(product => `
      <div class="search-item" onclick="goToProduct(${product.id})">
        <img src="/images/${product.image}" alt="${product.name}">
        <div class="search-item-info">
          <span class="search-item-name">${product.name}</span>
          <span class="search-item-price">kr ${product.price}</span>
        </div>
      </div>
    `).join('');
  }

  overlay.classList.add('active');
}

// Redirect to product page with id in URL
function goToProduct(id) {
  window.location.href = '/products.html?id=' + id;
}




// Toggle mobile sidebar menu open and closed
let menustatus = 0;

function toggleMenu() {
  const sidebarlinks = document.querySelectorAll('.sidenavbar');

  if (menustatus === 0) {
    sidebarlinks.forEach(nav => nav.style.display = "inline");
    menustatus = 1;
  } else if (menustatus === 1) {
    sidebarlinks.forEach(nav => nav.style.display = "none");
    menustatus = 0;
  }
}

// Searchbar - close overlay when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.searchbar') && !e.target.closest('#search-overlay')) {
    document.getElementById('search-overlay').classList.remove('active');
  }
});

// Searchbar - Press enter to go to products page
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('search').value;
    if (query.trim() !== '') {
      window.location.href = '/products.html?search=' + encodeURIComponent(query);
    }
  }
});
</script>
</body>
