<div class="sidenavbar">
            <li class="search-wrapper">

</div>


    <div class="logincontainer">

        <div class="signincontainer">

            <h1 class="headerauth">Sign In</h1>

            <div class="signinbox"><!-- #####SIGN IN##### -->
                <input class="authinputbox" placeholder="Email" type="email" id="signin-email">
                <input class="authinputbox" placeholder="Password" type="password" id="signin-password">

                <button class="authbtnbox" onclick="signIn()" >Sign In</button>
                <p id="signin-msg"></p>
            </div>
        </div>



        <div class="signupcontainer">

            <h1 class="headerauth">Sign Up</h1>

            <div class="signupbox">  <!-- ######SIGN UP#### -->
                <input class="authinputbox" placeholder="Email" type="email" id="signup-email">
                <input class="authinputbox" placeholder="Password" type="password" id="signup-password">

                <button class="authbtnbox" onclick="signUp()" >Sign up</button>
                <p id="signup-msg"></p>
            </div>
        </div>



    </div>

    <script>



        async function userloggedin(){
            const res = await fetch('/getemail');
            const data = await res.json();

            if (data.email) {
                document.getElementById('loggedinuserID').textContent = data.email;
            } else {
                document.getElementById('loggedinuserID').textContent = data.email;
            
            }

        }
    userloggedin();


        async function signUp() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            const res = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password})
            });
        /* 
        fetch() sends the data to your Express server at /signup.

        method: 'POST' — you're sending data, not requesting a page
        headers — tells the server the data is JSON
        body — the actual data, converted to a JSON string 
        */
            const data = await res.json();
            document.getElementById('signup-msg'). textContent = data.message;
        }

        async function signIn() {
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            const res = await fetch('/signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify ({ email, password })
            });

            const data = await res.json();
            document.getElementById('signin-msg').textContent = data.message;

            if (res.ok) {
                window.location.href = '/dashboard';
            }

        }


        async function signOut() {
            await fetch('/signout', {method: 'POST'});
            window.location.href = '/login.html';
        }

        async function checkSession(){
            const res = await fetch('/check-session');
            const data = await res.json();

            if (data.loggedIn) {
                document.getElementById('signout-btn'). style.display = 'block';
            }
        }

        checkSession();

let allProducts = [];

async function fetchProducts() {
  if (allProducts.length === 0) {
    const res  = await fetch('/products');
    allProducts = await res.json();
  }
}

async function handleSearch() {
  const query   = document.getElementById('search').value.toLowerCase();
  const overlay = document.getElementById('search-overlay');
  const results = document.getElementById('search-results');

  if (query.trim() === '') {
    overlay.classList.remove('active');
    return;
  }

  await fetchProducts();

  const filtered = allProducts.filter(product =>
    product.name.toLowerCase().includes(query) ||
    product.description.toLowerCase().includes(query)
  );

  if (filtered.length === 0) {
    results.innerHTML = '<p style="padding:10px">No results found.</p>';
  } else {
    results.innerHTML = filtered.map(product => `
      <div class="search-item" onclick="goToProduct(${product.id})">
        <img src="/images/${product.image}" alt="${product.name}">
        <div class="search-item-info">
          <span class="search-item-name">${product.name}</span>
          <span class="search-item-price">kr ${product.price}</span>
        </div>
      </div>
    `).join('');
  }

  overlay.classList.add('active');
}

function goToProduct(id) {
  window.location.href = '/products.html?id=' + id;
}




let menustatus = 0;

function toggleMenu() {
  const sidebarlinks = document.querySelectorAll('.sidenavbar');

  if (menustatus === 0) {
    sidebarlinks.forEach(nav => nav.style.display = "inline");
    menustatus = 1;
  } else if (menustatus === 1) {
    sidebarlinks.forEach(nav => nav.style.display = "none");
    menustatus = 0;
  }
}

// Searchbar - close overlay when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.searchbar') && !e.target.closest('#search-overlay')) {
    document.getElementById('search-overlay').classList.remove('active');
  }
});

// Searchbar - Press enter to go to products page
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('search').value;
    if (query.trim() !== '') {
      window.location.href = '/products.html?search=' + encodeURIComponent(query);
    }
  }
});

    </script>
</body>
