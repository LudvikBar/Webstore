<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite" />
</head>


<body>
<nav class="navbar">
    <div class="backgroundnav">
        <ul class="navbarlinks">
            <li><a class="navlogo" href="index.html">LsbPrint</a></li>

            <li id="navbarId" class="search-wrapper">
                <input class="searchbar" id="search" placeholder="Search" type="text" oninput="handleSearch()">
                <div id="search-overlay">
                    <div id="search-results"></div>

        </ul>
        <p id="loggedinuserID"></p>
        <button id="signout-btn" onclick="signOut()" style="display:none">Sign Out</button>
        <a id="logginbtnID" class="logginbtn" href="login.html">Loggin</a>

    <li class="menu-btn-wrapper">
        <span class="material-symbols-outlined menu-btn" onclick="toggleMenu()">menu</span>
    </li>
    </div>
</nav>

<div class="sidenavbar">

            <li class="sidenavbarlinklogo"><a href="index.html">LsbPrint</a></li>

            <li class="search-wrapper">
  <input class="searchbar" id="search-side" placeholder="Search" type="text" oninput="handleSearch('side')">
<div id="search-overlay-side">
    <div id="search-results-side"></div>
</div>
            </li>


            <div class="sidenavbarbottontwo">
            <li class="sidenavbarlinks"><a href="products.html">Produkter</a></li>
            <li class="sidenavbarlinks"><a href="Om oss.html">Om oss</a></li>
            </div>


</div>




<div id="favorites-listingID"></div>



<script>


    async function userloggedin(){
        const res = await fetch('/getemail');
        const data = await res.json();

        if (data.email) {
            document.getElementById('loggedinuserID').textContent = data.email;
        } else {
            document.getElementById('loggedinuserID').textContent = data.email;
            
        }

    }
userloggedin();


    async function checkSession(){
        const res = await fetch('/check-session');
        const data = await res.json();

        if (data.loggedIn) {
            document.getElementById('signout-btn'). style.display = 'block';
            document.getElementById('logginbtnID'). style.display = 'none';
        }
    }

    checkSession();
    
    async function signOut(){
        await fetch('/signout', { method: 'POST' });
        window.location.href = '/login.html';
    }



let allProducts = [];

async function fetchProducts() {
  if (allProducts.length === 0) {
    const res  = await fetch('/products');
    allProducts = await res.json();
  }
}

async function handleSearch(suffix = '') {
  const id = suffix ? `search-${suffix}` : 'search';
  const query   = document.getElementById(id).value.toLowerCase();
  const overlay = document.getElementById(suffix ? `search-overlay-${suffix}` : 'search-overlay');
  const results = document.getElementById(suffix ? `search-results-${suffix}` : 'search-results');

  if (query.trim() === '') {
    overlay.classList.remove('active');
    return;
  }

  await fetchProducts();

  const filtered = allProducts.filter(product =>
    product.name.toLowerCase().includes(query) ||
    product.description.toLowerCase().includes(query)
  );

  results.innerHTML = filtered.length === 0
    ? '<p style="padding:10px">No results found.</p>'
    : filtered.map(product => `
        <div class="search-item" onclick="goToProduct(${product.id})">
          <img src="/images/${product.image}" alt="${product.name}">
          <div class="search-item-info">
            <span class="search-item-name">${product.name}</span>
            <span class="search-item-price">kr ${product.price}</span>
          </div>
        </div>
      `).join('');

  overlay.classList.add('active');
}

function goToProduct(id) {
  window.location.href = '/products.html?id=' + id;
};


let menustatus = 0;

function toggleMenu() {
  const sidebarlinks = document.querySelectorAll('.sidenavbar');

  if (menustatus === 0) {
    sidebarlinks.forEach(nav => nav.style.display = "inline");
    menustatus = 1;
  } else if (menustatus === 1) {
    sidebarlinks.forEach(nav => nav.style.display = "none");
    menustatus = 0;
  }
}




// Searchbar - close overlay when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.searchbar') && !e.target.closest('#search-overlay')) {
    document.getElementById('search-overlay').classList.remove('active');
  }
});

// Searchbar - Press enter to go to products page
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('search').value;
    if (query.trim() !== '') {
      window.location.href = '/products.html?search=' + encodeURIComponent(query);
    }
  }
});


async function viewFavorites(){
    try {
        const res = await fetch('/favorite');

        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }


        const favorites = await res.json();
        const container = document.getElementById('favorites-listingID');

        if ( favorites.length === 0) {
            container.innerHTML = '<h3>Ingen favoritter enda</h3>';
            return;
        }
container.innerHTML = favorites.map(product => `
            <div class="card">
                <div class="card-img">
                    <img class="prodimg" src="/images/${product.image}" alt="${product.name}">
                </div>
                <div class="card-title">${product.name}</div>
                <div class="card-subtitle">${product.description}</div>
                <hr class="card-divider">
                <div class="card-footer">
                    <div class="card-price"><span>kr</span>${product.price}</div>
                </div>
            </div>
        `).join('');
        
    } catch (err) {
        console.error('Error: ', err);
    }
};


viewFavorites();

</script>
</body>
</html>
